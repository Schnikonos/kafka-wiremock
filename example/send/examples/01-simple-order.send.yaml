priority: 10
name: "simple-order-send"
tags: ["example", "basic", "order"]
skip: false
timeout_ms: 5000

inject:
  - message_id: "order1"
    destination: "users.commands"
    headers:
      my-test-header: "HeaderValue123"
    key: "myMessageKey"
    payload: |
      {
        "orderId": "{{testId}}-{{uuid}}",
        "sourceId": "{{uuid}}",
        "username": "ABC",
        "action": "REGISTER",
        "source": "SomeSource",
        "email": "aaa@ing.com",
        "customerId": "CUST-123",
        "amount": 99.99,
        "status": "NEW"
      }

