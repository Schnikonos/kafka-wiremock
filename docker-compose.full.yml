services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wiremock-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
       test: ["CMD", "bash", "-c", "kafka-broker-api-versions.sh --bootstrap-server localhost:29092 | grep ApiVersion || echo 'Kafka is ready'"]
       interval: 10s
       timeout: 10s
       retries: 30
       start_period: 20s
    networks:
       - wiremock-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/clusters"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wiremock-network

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c '
      echo "Creating Kafka topics..."
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic orders.processed \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic users.commands \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic users.events \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic payments.processed \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic orders.input \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic orders.output \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic payments.avro \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic audit.avro \
        --partitions 2 \
        --replication-factor 1 \
        --config retention.ms=43200000
      echo "Topics created successfully"
      kafka-topics --bootstrap-server kafka:29092 --list
      '
    networks:
      - wiremock-network

  ibm-mq:
    image: icr.io/ibm-messaging/mq:9.3.4.0-r1-amd64
    ports:
      - "1414:1414"
      - "9443:9443"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
      MQ_ADMIN_PASSWORD: passw0rd
    volumes:
      - ./example/ibmmq-init.mqsc:/etc/mqm/ibmmq-init.mqsc:ro
      - mq-data:/mnt/mqm
    healthcheck:
      test: ["CMD", "dspmq", "-m", "QM1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wiremock-network

  # ── Dummy API targets for HTTP/HTTPS testing ──────────────────────────────
  dummy-app-http:
    build:
      context: ./test-dummy-app
      dockerfile: Dockerfile
    ports:
      - "9081:8080"
    environment:
      PORT: "8080"
      MODE: "http"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - wiremock-network

  dummy-app-https-t1:
    build:
      context: ./test-dummy-app
      dockerfile: Dockerfile
    ports:
      - "9082:8080"
    environment:
      PORT: "8080"
      MODE: "https"
      SSL_CERTFILE: "/certs/server-t1.pem"
      SSL_KEYFILE:  "/certs/server-t1.key"
      SSL_CA_CERTS:             "/certs/ca1.pem"
      SSL_REQUIRE_CLIENT_CERT:  "true"
    volumes:
      - ./test-dummy-app/certs:/certs:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,ssl; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; ctx.load_cert_chain('/certs/c1.pem','/certs/c1.key'); urllib.request.urlopen('https://localhost:8080/health', context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wiremock-network

  dummy-app-https-t2:
    build:
      context: ./test-dummy-app
      dockerfile: Dockerfile
    ports:
      - "9083:8080"
    environment:
      PORT: "8080"
      MODE: "https"
      SSL_CERTFILE: "/certs/server-t2.pem"
      SSL_KEYFILE:  "/certs/server-t2.key"
      SSL_CA_CERTS:             "/certs/ca2.pem"
      SSL_REQUIRE_CLIENT_CERT:  "true"
    volumes:
      - ./test-dummy-app/certs:/certs:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,ssl; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; ctx.load_cert_chain('/certs/c2.pem','/certs/c2.key'); urllib.request.urlopen('https://localhost:8080/health', context=ctx)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wiremock-network

  # ── MySQL 8.0 ───────────────────────────────────────────────────────────────
  mysql-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: orders_db
      MYSQL_USER: orders_user
      MYSQL_PASSWORD: orders_pass
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./example/db-init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "orders_user", "--password=orders_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wiremock-network

  # ── Oracle 23c Free ─────────────────────────────────────────────────────────
  # Uses gvenzl/oracle-free — lightweight Oracle 23c, no licence required.
  # First startup takes ~60–90 s while the database is created.
  # APP_USER / APP_USER_PASSWORD create a schema-owning user; init scripts
  # under /container-entrypoint-initdb.d are run as that user afterwards.
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oraclepass       # SYS / SYSTEM password
      APP_USER: myuser                  # Application user (= onepam.username in databases.yaml)
      APP_USER_PASSWORD: oracleapppass  # DB_ONEPAM_PASSWORD must match this
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./example/db-init/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL",
             "echo 'SELECT 1 FROM DUAL;' | sqlplus -S myuser/oracleapppass@//localhost:1521/FREE | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - wiremock-network

  # ── Cassandra 4.1 ───────────────────────────────────────────────────────────
  # Uses AllowAllAuthenticator (no credentials required) for the local dev stack.
  # For production, mount a custom cassandra.yaml with PasswordAuthenticator enabled.
  cassandra-db:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: wiremock-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - wiremock-network

  # Cassandra does not have a built-in /docker-entrypoint-initdb.d mechanism,
  # so a one-shot init container runs after the cluster is healthy.
  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra-db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init.sh"]
    volumes:
      - ./example/db-init/cassandra:/init:ro
    networks:
      - wiremock-network

  # ── kafka-wiremock ──────────────────────────────────────────────────────────
  kafka-wiremock:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      ibm-mq:
        condition: service_healthy
      dummy-app-http:
        condition: service_healthy
      dummy-app-https-t1:
        condition: service_healthy
      dummy-app-https-t2:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CONFIG_DIR: /config
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      # ── JMS passwords (config/jms-config/queue-managers.yaml) ─────────────
      # Format: JMS_{QM_NAME_UPPERCASE}_PASSWORD
      JMS_QM_DEV_LOCAL_PASSWORD: passw0rd
      JMS_QM_US_EAST_PASSWORD: passw0rd
      JMS_QM_EU_WEST_PASSWORD: passw0rd
      JMS_QM_BACKUP_PASSWORD: passw0rd
      # ── DB passwords (config/db-config/databases.yaml) ────────────────────
      # Format: DB_{NAME_UPPERCASE}_PASSWORD — must match container credentials above
      DB_ONEPAM_PASSWORD: oracleapppass        # oracle-db APP_USER_PASSWORD
      DB_MYSQL_ORDERS_PASSWORD: orders_pass    # mysql-db MYSQL_PASSWORD
      # DB_SOMECASSANDRA_PASSWORD not needed — local Cassandra uses AllowAllAuthenticator
    volumes:
      - ./example/config:/config
      - ./example/testSuite:/testSuite
      - ./example/send:/send
      - ./example/logs:/var/log/wiremock
      # Client certificates for outbound mTLS calls to dummy-app targets
      - ./test-dummy-app/certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - wiremock-network

networks:
  wiremock-network:
    driver: bridge

volumes:
  mq-data:
  mysql-data:
  oracle-data:
  cassandra-data:
